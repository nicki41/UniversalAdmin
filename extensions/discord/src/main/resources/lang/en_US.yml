discord:
  command:
    usage: "[status|test|reload]"
    description: "Status, test message and config reload of the Discord integration."
  status-on: "<green>Discord logging is on.</green> <gray>Posting: {0}"
  status-bot: "<aqua>Discord bot:</aqua> <white>{0}"
  not-configured: "<yellow>No valid webhook URL yet - set webhook-url in plugins/UniversalAdminDiscord/config.yml, then /admin discord reload."
  bot-not-configured: "<yellow>Bot mode needs bot.token and bot.guild-id in plugins/UniversalAdminDiscord/config.yml - then /admin discord reload."
  reloaded: "<green>Discord configuration reloaded."
  reloaded-bot: "<green>Discord configuration reloaded - the bot is reconnecting. <gray>/admin discord status in a few seconds."
  test-sending: "<gray>Sending a test message to Discord..."
  test-ok: "<green>Test message delivered - check your Discord channel."
  test-failed: "<red>Discord did not accept the test message (status {0}). Check the webhook URL."
  test-bot-failed: "<red>The bot could not post the test message <gray>({0})</gray> - check the channel ids and the bot''s permissions there."
  # Texts the bot shows in Discord - plain text, no formatting tags.
  bot:
    no-reply: "Done - the server sent no reply."
    unavailable: "UniversalAdmin is not ready for this right now."
    not-allowed: "Your roles do not allow this."
    empty-command: "Type an /admin command, e.g. history Steve."
    missing-option: "Something is missing - fill in every required field."
    invalid-player: "That is not a Minecraft player name."
    invalid-duration: "Not a duration - e.g. 30m, 12h, 7d, 1d12h, or permanent."
    invalid-template: "Not a template name - e.g. spam."
    attachment: "[attachment]"
    test-title: "UniversalAdmin bot is connected"
    test-text: "Test message sent by {0} from {1}."
    state:
      starting: "connecting..."
      not-configured: "not configured"
      not-in-guild: "connected, but not on the Discord server {0} - invite the bot first"
      online: "online as {0} on {1}"
      failed: "could not connect: {0}"
    command:
      ban: "Ban a player (temporarily with a duration)"
      mute: "Mute a player (temporarily with a duration)"
      kick: "Kick a player who is online"
      warn: "Warn a player"
      punish: "Punish with a template - the step depends on earlier punishments"
      unban: "Lift a player''s ban"
      unmute: "Lift a player''s mute"
      history: "A player''s punishment history"
      check: "Is a player banned, muted or frozen right now?"
      find: "Which server is a player on? (network mode)"
      ua: "Run any /admin command, e.g. notes Steve"
    option:
      player: "Minecraft player name"
      duration: "e.g. 30m, 12h, 7d - empty or permanent for no end"
      reason: "Reason"
      command: "The command without /admin, e.g. history Steve"
      template: "Punishment template, e.g. spam"
      note: "Optional note, added to the reason of the template"
    report:
      title: "Report #{0}"
      player: "Player"
      reporter: "Reported by"
      status: "Status"
      claim: "Claim"
      resolve: "Resolve"
      reject: "Reject"
      claimed: "Being handled by {0}"
      resolved: "Resolved by {0}"
      rejected: "Rejected by {0}"
      note-title: "Close report #{0}"
      note-label: "Note (optional)"
