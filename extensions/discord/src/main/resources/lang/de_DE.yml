discord:
  command:
    usage: "[status|test|reload]"
    description: "Status, Testnachricht und Neuladen der Discord-Anbindung."
  status-on: "<green>Discord-Protokoll ist an.</green> <gray>Gepostet wird: {0}"
  status-bot: "<aqua>Discord-Bot:</aqua> <white>{0}"
