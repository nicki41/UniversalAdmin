  test-failed: "<red>Discord hat die Testnachricht nicht angenommen (Status {0}). Prüfe die Webhook-URL."
  test-bot-failed: "<red>Der Bot konnte die Testnachricht nicht posten <gray>({0})</gray> - prüfe die Kanal-IDs und die Rechte des Bots dort."
