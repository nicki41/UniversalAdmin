# The Paper API every project compiles against.
#
# Supported servers: Paper 1.21.7 - 1.21.11 and 26.1.1 - 26.3 (and newer, as
# the compatibility workflow confirms them). The jars are Java 21 bytecode
# with api-version 1.21.7, so one jar runs on all of them. Code must only use
# API that exists on the oldest supported version - CI compiles against the
# oldest (1.21.7) and the newest Paper as well (see
# .github/workflows/build.yml and compatibility.yml); -PpaperApiVersion=<version>
# overrides this locally.
paperApiVersion=26.2.build.115-stable
