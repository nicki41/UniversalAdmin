command:
  # Prepended to every command reply. Set to "" to remove it.
  prefix: "<dark_gray>[<gradient:#55ddff:#3399ff>UA</gradient>]</dark_gray> "
  usage: "<red>Usage: <white>{0}"
  done: "<green>Done."
  error:
    player-only: "<red>Only players can use this command."
    unknown: "<red>Unknown command. Type <white>/{0} help</white> for a list."
    not-found: "<red>Not found: {0}"
    disabled: "<red>This feature is currently disabled."
    invalid: "<red>{0}"
    internal: "<red>Something went wrong - the details are in the server log."
    player-not-found: "<red>No player named <white>{0}</white> has played on this server."
    player-not-online: "<red><white>{0}</white> is not online."
    invalid-number: "<red>Not a valid number: <white>{0}"
    invalid-duration: "<red>Not a valid duration: <white>{0}</white> <gray>(examples: 30m, 2h, 7d, 1d12h)"
    world-not-found: "<red>No loaded world named <white>{0}"
    confirm-required: "<yellow>This cannot be undone. Repeat the command with <white>confirm</white> at the end to go ahead."
  help:
    usage: "[page]"
    description: "Lists every command you can use."
    header: "<gradient:#55ddff:#3399ff><bold>UniversalAdmin</bold></gradient> <gray>commands, page {0}/{1}"
    next: "<gray>» Next page: <white>/{0} help {1}</white> <dark_gray>(click)"
    hover: "<gray>Click to put this command into the chat line"
  menu:
    usage: ""
    description: "Opens the admin menu."
  status:
    usage: ""
    description: "Shows version, uptime and module status."
    header: "<gradient:#55ddff:#3399ff><bold>UniversalAdmin</bold></gradient> <gray>v{0}"
    uptime: "<gray>Uptime: <white>{0}"
    modules-active: "<gray>Active modules ({0}): <white>{1}"
    modules-failed: "<red>Failed modules: {0}"
    database-web: "<gray>Database: <white>{0}</white>  Web: <white>{1}"
    network: "<gray>Network: <white>{0}</white> <dark_gray>({1} server(s), {2} player(s))</dark_gray>"
    network-off: "<gray>Network: <white>off</white>"
  modules:
    usage: ""
    description: "Lists all modules and extensions with their state."
    header: "<gold>Modules and extensions ({0}):"
    entry:
      discovered: "<gray>○ {0} <dark_gray>({1})</dark_gray> - discovered"
      loaded: "<yellow>◐ {0} <dark_gray>({1})</dark_gray> - loaded"
      enabled: "<green>● {0} <dark_gray>({1})</dark_gray> <gray>{2}"
      disabled: "<gray>○ {0} <dark_gray>({1})</dark_gray> - disabled"
      failed: "<red>✘ {0} <dark_gray>({1})</dark_gray> - failed to start, see the server log"
