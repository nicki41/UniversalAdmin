      name: "<aqua>Chat"
      description: "<gray>Staff chat, chat lock, slow mode, clear chat."
    players:
      name: "<gold>Players"
      description: "<gray>Browse players, profiles, inventories and actions."
    moderation:
      name: "<red>Moderation"
      description: "<gray>Punishments, history, vanish and staff mode."
    server:
      name: "<aqua>Server"
      description: "<gray>Dashboard, broadcasts, maintenance and restarts."
    worlds:
      name: "<green>Worlds"
      description: "<gray>Time, weather, borders, spawn and gamerules."
    whitelist:
      name: "<white>Whitelist"
      description: "<gray>Who may join - including temporary access."
    performance:
      name: "<yellow>Performance"
      description: "<gray>TPS, memory, worlds and entity clean-up."
