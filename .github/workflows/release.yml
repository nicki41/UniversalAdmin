name: Release

# Tag-driven releases: pushing a tag like v0.1.0-alpha.1 builds, tests, and -
# only if both succeed - publishes a GitHub Release with the plugin jar and
# its SHA-256 checksum. Nothing is published on an ordinary commit, and
# nothing is published if a single test fails.
#
# Two ways to reach this workflow:
# - Manually: push a tag yourself - see docs/release/releasing.md.
# - Automatically: auto-release.yml pushes the version/changelog bump and
#   the tag itself, then calls this workflow directly via `workflow_call`
#   (not by relying on the tag push to trigger it - a push made with the
#   default GITHUB_TOKEN deliberately does not cascade into other workflow
#   runs, see auto-release.yml). Either path ends up here with the same
#   build/test/publish steps.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0-alpha.1) - set by auto-release.yml; unused on a direct tag push, where the triggering tag is used instead."
        required: true
        type: string

# contents: write is required to create the release and upload its assets.
# Nothing else is granted, and no secret beyond the automatic GITHUB_TOKEN is
# used. For the workflow_call path, this is only the ceiling - the actual
# grant is whatever the calling job's own `permissions:` allows.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag to build
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up JDK 25 (build toolchain) and 21 (runs Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Guard against publishing a mislabelled release: tag v0.2.0 must not
      # ship a jar built from version 0.1.0. Runs before the build so a
      # mismatch fails fast.
      - name: Verify tag matches the project version
        id: version
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(./gradlew -q --console=plain printVersion \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64)"
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag '$TAG_NAME' does not match the project version" \
                 "'$PROJECT_VERSION' in build.gradle.kts. Fix the version or the tag" \
                 "and tag again - see docs/release/releasing.md."
            exit 1
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: >-
          ./gradlew clean build --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      # The shaded plugin jar - the one file a server owner installs.
      - name: Locate release jar and create SHA-256 checksum
        id: artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          JAR="build/libs/universaladmin-core-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected release jar '$JAR' was not produced by the build."
            ls -l build/libs || true
            exit 1
          fi
          ( cd build/libs && sha256sum "universaladmin-core-${VERSION}.jar" \
              > "universaladmin-core-${VERSION}.jar.sha256" )
          cat "${JAR}.sha256"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "checksum=${JAR}.sha256" >> "$GITHUB_OUTPUT"

      # Attached next to the plugin jar: the official Discord and
      # PlaceholderAPI extensions (their own plugin jars), the Velocity and
      # BungeeCord plugins for network mode, and the
      # extension API for developers (binary, sources, javadoc). The plugin
      # jar and the proxy jars also go to Modrinth (below).
      - name: Collect extension, proxy and API artifacts
        id: extras
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DISCORD="extensions/discord/build/libs/universaladmin-discord-${VERSION}.jar"
          PLACEHOLDERS="extensions/placeholderapi/build/libs/universaladmin-placeholderapi-${VERSION}.jar"
          VELOCITY="proxy/velocity/build/libs/universaladmin-velocity-${VERSION}.jar"
          BUNGEE="proxy/bungee/build/libs/universaladmin-bungee-${VERSION}.jar"
          API="api/build/libs/universaladmin-api-${VERSION}.jar"
          for f in "$DISCORD" "$PLACEHOLDERS" "$VELOCITY" "$BUNGEE" "$API" \
              "api/build/libs/universaladmin-api-${VERSION}-sources.jar" \
              "api/build/libs/universaladmin-api-${VERSION}-javadoc.jar"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected artifact '$f' was not produced by the build."
              exit 1
            fi
          done
          ( cd extensions/discord/build/libs && sha256sum "universaladmin-discord-${VERSION}.jar" \
              > "universaladmin-discord-${VERSION}.jar.sha256" )
          ( cd extensions/placeholderapi/build/libs && sha256sum "universaladmin-placeholderapi-${VERSION}.jar" \
              > "universaladmin-placeholderapi-${VERSION}.jar.sha256" )
          ( cd proxy/velocity/build/libs && sha256sum "universaladmin-velocity-${VERSION}.jar" \
              > "universaladmin-velocity-${VERSION}.jar.sha256" )
          ( cd proxy/bungee/build/libs && sha256sum "universaladmin-bungee-${VERSION}.jar" \
              > "universaladmin-bungee-${VERSION}.jar.sha256" )
          {
            echo "files<<FILES_EOF"
            echo "$DISCORD"
            echo "${DISCORD}.sha256"
            echo "$PLACEHOLDERS"
            echo "${PLACEHOLDERS}.sha256"
            echo "$VELOCITY"
            echo "${VELOCITY}.sha256"
            echo "$BUNGEE"
            echo "${BUNGEE}.sha256"
            echo "$API"
            echo "api/build/libs/universaladmin-api-${VERSION}-sources.jar"
            echo "api/build/libs/universaladmin-api-${VERSION}-javadoc.jar"
            echo "FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "velocity=$VELOCITY" >> "$GITHUB_OUTPUT"
          echo "bungee=$BUNGEE" >> "$GITHUB_OUTPUT"
          echo "discord=$DISCORD" >> "$GITHUB_OUTPUT"
          echo "placeholders=$PLACEHOLDERS" >> "$GITHUB_OUTPUT"

      # One list for every place that names the supported Minecraft
      # versions: supported-versions.txt (kept current by compatibility.yml).
      - name: Read supported Minecraft versions
        id: games
        run: |
          set -euo pipefail
          {
            echo "list<<GAMES_EOF"
            grep -vE '^\s*(#|$)' supported-versions.txt
            echo "GAMES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Release notes come from the matching CHANGELOG section. Versions with
      # a pre-release suffix are flagged "Pre-release" (see "Create GitHub
      # release" below and docs/release/releasing.md#version-scheme).
      - name: Determine release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Use the CHANGELOG section for this version when there is one, on
          # top of GitHub's generated commit/PR notes. When the changelog has
          # no matching "## [<version>]" heading, the generated notes stand
          # alone rather than guessing.
          if [ -f CHANGELOG.md ] && grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            awk -v version="## [${VERSION}]" '
              index($0, version) == 1 { collecting = 1; next }
              collecting && /^## / { exit }
              collecting { print }
            ' CHANGELOG.md > release-notes.md
            echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARGS=(
            "${{ steps.tag.outputs.name }}"
            "${{ steps.artifact.outputs.jar }}"
            "${{ steps.artifact.outputs.checksum }}"
            --title "UniversalAdmin ${VERSION}"
            --generate-notes
          )
          while IFS= read -r extra; do
            [ -n "$extra" ] && ARGS+=("$extra")
          done <<< "${{ steps.extras.outputs.files }}"
          # From 1.0.0 on, -alpha/-beta/-rc builds are flagged Pre-release:
          # GitHub's /releases/latest (which the in-plugin update check
          # reads) then only ever returns a stable version, so servers on a
          # stable release are never offered a pre-release.
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if [ -n "${{ steps.notes.outputs.notes_file }}" ]; then
            ARGS+=(--notes-file "${{ steps.notes.outputs.notes_file }}")
          fi
          gh release create "${ARGS[@]}"
          {
            echo "body<<GH_RELEASE_BODY_EOF"
            gh release view "${{ steps.tag.outputs.name }}" --json body -q .body
            echo "GH_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Mirrors the same release onto the Modrinth project (id wGP5uSse).
      # fail-mode: warn so a Modrinth-side hiccup doesn't mark the whole
      # release as failed - the GitHub release above has already succeeded
      # by this point.
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: wGP5uSse
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/universaladmin-core-${{ steps.version.outputs.version }}.jar
          name: UniversalAdmin ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog: ${{ steps.github_release.outputs.body }}
          # Paper and its forks that run Paper plugins unchanged.
          loaders: |
            paper
            purpur
          # Every version in supported-versions.txt: built for the oldest
          # (Java 21 bytecode, api-version 1.21.7), compiled against the
          # newest, and boot-tested on each - see docs/user/installation.md.
          game-versions: ${{ steps.games.outputs.list }}
          java: 21
          fail-mode: warn

      # The optional proxy plugin for network mode, as its own version in
      # the same Modrinth project (loader "velocity").
      - name: Publish the Velocity plugin to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: wGP5uSse
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.extras.outputs.velocity }}
          name: UniversalAdmin Velocity ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}-velocity
          changelog: |
            The optional Velocity plugin for UniversalAdmin's network mode: refuses players banned with UniversalAdmin at the proxy, and keeps it closed during network maintenance and to players not on the network whitelist. Install UniversalAdmin ${{ steps.version.outputs.version }} on your servers as well - see https://github.com/nicki41/UniversalAdmin/blob/main/docs/user/network.md
          loaders: velocity
          game-versions: ${{ steps.games.outputs.list }}
          java: 21
          fail-mode: warn

      # The same checks for BungeeCord networks, as another version of the
      # same Modrinth project.
      - name: Publish the BungeeCord plugin to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: wGP5uSse
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.extras.outputs.bungee }}
          name: UniversalAdmin BungeeCord ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}-bungee
          changelog: |
            The optional BungeeCord plugin for UniversalAdmin's network mode: refuses players banned with UniversalAdmin at the proxy, and keeps it closed during network maintenance and to players not on the network whitelist. Install UniversalAdmin ${{ steps.version.outputs.version }} on your servers as well - see https://github.com/nicki41/UniversalAdmin/blob/main/docs/user/network.md
          loaders: |
            bungeecord
            waterfall
          game-versions: ${{ steps.games.outputs.list }}
          java: 21
          fail-mode: warn

      # The official extensions have their own Modrinth projects (all three
      # are in the collection "UniversalAdmin"), released together with the
      # plugin and depending on it.
      - name: Publish UniversalAdmin Discord to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Lq5Ihyzr
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.extras.outputs.discord }}
          name: UniversalAdmin Discord ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog: |
            Released with UniversalAdmin ${{ steps.version.outputs.version }} - see its changelog: https://github.com/nicki41/UniversalAdmin/releases/tag/v${{ steps.version.outputs.version }}
          loaders: |
            paper
            purpur
          game-versions: ${{ steps.games.outputs.list }}
          dependencies: |
            universaladmin(required){modrinth:wGP5uSse}
          java: 21
          fail-mode: warn

      - name: Publish UniversalAdmin Placeholders to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: 229V0zwE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.extras.outputs.placeholders }}
          name: UniversalAdmin Placeholders ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog: |
            Released with UniversalAdmin ${{ steps.version.outputs.version }} - see its changelog: https://github.com/nicki41/UniversalAdmin/releases/tag/v${{ steps.version.outputs.version }}
          loaders: |
            paper
            purpur
          game-versions: ${{ steps.games.outputs.list }}
          dependencies: |
            universaladmin(required){modrinth:wGP5uSse}
            placeholderapi(required){modrinth:lKEzGugV}
          java: 21
          fail-mode: warn
