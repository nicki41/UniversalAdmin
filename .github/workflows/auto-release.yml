name: Auto Release

# Releases automatically after a push to main that changes anything besides
# docs/CI metadata, instead of requiring the manual version/changelog/tag
# steps in docs/release/releasing.md every time. Only ever bumps the
# prerelease counter of a plain "X.Y.Z-alpha"/"X.Y.Z-alpha.N" version - a
# beta/rc/stable release is a bigger decision than this workflow is meant to
# make on its own, and still goes through the manual process.
#
# What "notable" means here: the push touched at least one file outside
# docs/, .github/, and the small set of root-level Markdown/meta files - see
# the "Determine whether this push is notable" step below for the exact
# list. A pure documentation or workflow-only push is skipped.
#
# Deliberately two jobs, not one:
# - `prepare` decides notability, bumps `version` in build.gradle.kts, moves
#   the CHANGELOG's `[Unreleased]` section into a dated, versioned one, then
#   commits and tags that on `main` using the default GITHUB_TOKEN.
# - `release` calls release.yml directly via `workflow_call`, rather than
#   relying on the tag push from `prepare` to trigger it: GitHub does not
#   fire further workflow runs from a push made with the default
#   GITHUB_TOKEN (its built-in recursion guard), so a plain `git push` of the
#   tag here would otherwise publish nothing. `workflow_call` runs
#   release.yml's job directly as part of *this* run instead of depending on
#   that push triggering a separate one.
#
# The guard on the `prepare` job's own `if:` (skip when the triggering
# commit's message starts with "chore: release ") is a second, independent
# safety net against a release-commit-triggers-another-release loop, in case
# this workflow is ever changed to push with something other than
# GITHUB_TOKEN.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and tag
    if: "!startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notable: ${{ steps.decide.outputs.notable }}
      tag: ${{ steps.decide.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether this push is notable
        id: touched
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$LAST_TAG" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          else
            BASE="$LAST_TAG"
          fi
          echo "Comparing against: $BASE"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"
          # Excluded: pure documentation and CI/repo-meta files. Everything
          # else (src/, build.gradle.kts, settings.gradle.kts, resources,
          # gradle/, ...) counts as notable.
          NOTABLE="$(echo "$CHANGED" | grep -vE '^(docs/|\.github/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|ROADMAP\.md$|ARCHITECTURE\.md$|RELEASE_READINESS\.md$|LICENSE$|\.gitignore$)' || true)"
          if [ -z "$NOTABLE" ]; then
            echo "notable=false" >> "$GITHUB_OUTPUT"
          else
            echo "notable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25 (build toolchain) and 21 (runs Gradle)
        if: steps.touched.outputs.notable == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        if: steps.touched.outputs.notable == 'true'
        uses: gradle/actions/setup-gradle@v6

      # Build and test the tree exactly as pushed, before touching version/
      # changelog metadata - so a broken build never gets tagged and handed
      # to release.yml (which would build/test again and simply fail, but
      # only after already consuming a version number and leaving a dangling
      # "chore: release" commit behind).
      - name: Build and test
        if: steps.touched.outputs.notable == 'true'
        run: >-
          ./gradlew clean build --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      # Determines whether the current version is even a plain -alpha/-alpha.N
      # prerelease (a beta/rc/stable bump is a bigger decision this workflow
      # doesn't make on its own) - a one-shot check, not part of the retry
      # loop below, since it doesn't depend on the exact tip of main.
      - name: Check the current version is auto-releasable
        id: version_check
        if: steps.touched.outputs.notable == 'true'
        run: |
          set -euo pipefail
          CURRENT="$(./gradlew -q --console=plain printVersion \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64)"
          if [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]]; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Current version '$CURRENT' is not a plain -alpha/-alpha.N prerelease - a beta/rc/stable release is a bigger decision than this workflow makes on its own. Skipping automatic release; use docs/release/releasing.md to release '$CURRENT' manually."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
          fi

      # Computes the version, edits build.gradle.kts/CHANGELOG.md, commits,
      # tags, and pushes - retried from a fresh `git fetch` + `reset --hard`
      # on a rejected push (main moved between checkout and push, e.g.
      # another push landed, or - as happened once - a backlog of delayed
      # runs racing each other) rather than failing outright. Recomputes
      # everything from the new tip on each attempt instead of rebasing the
      # old commit onto it, so a CHANGELOG.md conflict with whatever just
      # landed can never leave this stuck waiting on manual conflict
      # resolution that a non-interactive job could never do anyway. Not
      # re-run: the "Build and test" step above, which only ever validated
      # the tree as originally checked out - acceptable since a retry only
      # ever happens because *another already-pushed, independently-built*
      # commit landed first, not because this run's own tree changed.
      - name: Bump version, commit, tag, and push (retried on a push race)
        id: decide
        if: steps.touched.outputs.notable == 'true' && steps.version_check.outputs.releasable == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "::group::Attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            CURRENT="$(./gradlew -q --console=plain printVersion \
              -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64)"
            if [[ ! "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-alpha(\.([0-9]+))?$ ]]; then
              echo "::error::Version on origin/main ('$CURRENT') is no longer a plain -alpha/-alpha.N prerelease - someone else must have released in the meantime. Aborting without pushing."
              exit 1
            fi
            BASE="${BASH_REMATCH[1]}"
            N="${BASH_REMATCH[3]:-0}"
            VERSION="${BASE}-alpha.$((N + 1))"
            TAG="v${VERSION}"
            echo "Current: $CURRENT -> Next: $VERSION"

            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" build.gradle.kts
            grep -q "^version = \"${VERSION}\"\$" build.gradle.kts

            DATE="$(date -u +%Y-%m-%d)"
            awk -v date="$DATE" -v version="$VERSION" '
              /^## \[Unreleased\]/ && !done {
                print "## [Unreleased]"
                print ""
                print "## [" version "] - " date
                done = 1
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
            grep -q "^## \[${VERSION}\]" CHANGELOG.md

            git add build.gradle.kts CHANGELOG.md
            git commit -m "chore: release ${VERSION}"

            # The branch push is the race-prone one (rejected if main moved
            # since the reset above); only tag - a brand new name each time,
            # nothing to race against - once that commit has actually landed,
            # so a rejected branch push never leaves an orphaned tag behind.
            if git push origin HEAD:main; then
              git tag "$TAG"
              git push origin "$TAG"
              echo "notable=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt} (someone else pushed first) - retrying from the new tip."
            echo "::endgroup::"
          done

          echo "::error::Could not push the release commit/tag after 5 attempts - main kept moving faster than this job could keep up. Not releasing this run; the next notable push will try again."
          exit 1

  release:
    name: Build and publish release
    needs: prepare
    if: needs.prepare.outputs.notable == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # A called reusable workflow gets NO repository secrets by default -
    # only secrets: inherit forwards them. Without this, MODRINTH_TOKEN
    # silently arrives empty on this path (GITHUB_TOKEN still works, since
    # that one is generated per-run rather than being a stored secret).
    secrets: inherit
    with:
      tag: ${{ needs.prepare.outputs.tag }}
