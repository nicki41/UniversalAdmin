name: Build

# Compiles, tests, and packages the plugin on every push to main and every PR
# against main. Deliberately publishes nothing: releases are produced by
# release.yml, triggered by a version tag, never by an ordinary commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow needs the source and nothing else.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Two JDKs on purpose. Gradle itself runs on the last one listed (21);
      # the compile/test toolchain the project actually targets is Java 25
      # (see build.gradle.kts), provided here as JAVA_HOME_25_X64 so Gradle
      # can use a preinstalled JDK instead of downloading one. If that
      # detection ever fails, settings.gradle.kts' foojay resolver
      # auto-provisions the toolchain and the build still works.
      - name: Set up JDK 25 (build toolchain) and 21 (runs Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: >-
          ./gradlew clean build --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - name: Resolve project version
        id: version
        run: >-
          echo "version=$(./gradlew -q --console=plain printVersion
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64)" >> "$GITHUB_OUTPUT"

      # The single runnable, shaded plugin jar - the same artifact a release
      # publishes. No sources jar, no javadoc jar, no unshaded jar (the plain
      # `jar` task writes to the same file name and is overwritten by
      # shadowJar, so build/libs holds exactly one, installable jar).
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAdmin-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload Discord extension jar
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAdminDiscord-${{ steps.version.outputs.version }}
          path: extensions/discord/build/libs/*.jar
          if-no-files-found: error

      - name: Upload API jars
        uses: actions/upload-artifact@v7
        with:
          name: universaladmin-api-${{ steps.version.outputs.version }}
          path: api/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Velocity plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAdminVelocity-${{ steps.version.outputs.version }}
          path: proxy/velocity/build/libs/universaladmin-velocity-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            extensions/discord/build/reports/tests/test
            proxy/velocity/build/reports/tests/test
          if-no-files-found: ignore

  # One jar for every supported Paper version (supported-versions.txt) only
  # works if the code uses nothing newer than the oldest one, and nothing the
  # newest one removed. Compiles everything against both ends.
  api-compat:
    name: Compile against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: [oldest, newest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (build toolchain) and 21 (runs Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pick the Paper API version
        id: api
        run: |
          set -euo pipefail
          if [ "${{ matrix.paper }}" = "oldest" ]; then
            echo "version=1.21.7-R0.1-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            # Newest stable build of the newest Paper version.
            curl -fsS https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
              | grep -oE '<version>[0-9.]+\.build\.[0-9]+-stable</version>' | sed -E 's/<\/?version>//g' \
              | sort -V | tail -1 | sed 's/^/version=/' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile against ${{ steps.api.outputs.version }}
        run: >-
          ./gradlew compileJava compileTestJava --console=plain
          -PpaperApiVersion=${{ steps.api.outputs.version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
