name: Feature request
description: Suggest a new module, action, or capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New features build on the existing layered architecture
        (Frontend → Service → Action → Repository) rather than working around
        it - see
        [ARCHITECTURE.md](https://github.com/nicki41/UniversalAdmin/blob/main/ARCHITECTURE.md)
        and the
        [development rules](https://github.com/nicki41/UniversalAdmin/blob/main/docs/development/architecture-rules.md)
        before proposing something that would require an architectural change.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that UniversalAdmin doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like to see? If it's a new action or GUI page, note which
        existing module it would belong to (or whether it needs a new one).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, including workarounds you use today.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does this belong?
      options:
        - Core (a built-in module or the platform itself)
        - Extension (once the public extension API exists)
        - Web app (once it exists)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else - screenshots, links, how other plugins solve this.
    validations:
      required: false
