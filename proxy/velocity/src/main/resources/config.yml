# UniversalAdmin for Velocity.
#
# Turns players banned with UniversalAdmin away at the proxy - before they
# reach any server, including servers that do not run UniversalAdmin - and
# keeps the network closed during network maintenance and to everyone not on
# the network whitelist while that is on. It reads the same
# MySQL/MariaDB database as your servers (their config.yml -> database) and
# never writes to it. Setup guide:
# https://github.com/nicki41/UniversalAdmin/blob/main/docs/user/network.md
#
# /uavelocity shows whether the checks run (permission:
# universaladmin.velocity.status). Changes here need a proxy restart.

database:
  host: localhost
  port: 3306
  database: universaladmin
  username: universaladmin
  password: ""
  ssl: true
  # The proxy only reads a row or two per login - a small pool is plenty.
  pool-size: 3

ban-check:
  enabled: true
  # If the database cannot be reached during a login: let the player in
  # (true - the servers still check on join) or keep everyone out (false).
  allow-on-error: true

maintenance-check:
  # Refuse logins while the whole network is in maintenance
  # (/admin maintenance network on). Players with
  # universaladmin.bypass.maintenance on the proxy (a permissions plugin such
  # as LuckPerms) and names on the network allow-list still get in. Needs
  # UniversalAdmin 1.2.1 or newer on the servers.
  enabled: true
  # MiniMessage. Server list text during network maintenance; empty = unchanged.
  motd: "<red><bold>Maintenance</bold></red>\n<gray>We will be back soon."
  # Shown in red instead of the player count during network maintenance; empty = unchanged.
  version-text: "Maintenance"

whitelist-check:
  # Refuse logins while the network whitelist is on (/admin whitelist network
  # on) for players who are not on it. Players with
  # universaladmin.bypass.network-whitelist on the proxy still get in. Needs
  # UniversalAdmin 1.3.0 or newer on the servers.
  enabled: true

messages:
  # MiniMessage. <reason>, <expires> and <remaining> are filled in as plain text.
  banned-permanent: "<red><bold>You are banned from this network.</bold></red>\n\n<gray>Reason: <white><reason>"
  banned-temporary: "<red><bold>You are banned from this network.</bold></red>\n\n<gray>Reason: <white><reason>\n<gray>Until: <white><expires> <dark_gray>(<remaining> left)"
  no-reason: "No reason given"
  # Shown to players refused during network maintenance, unless
  # /admin maintenance network set its own message.
  maintenance: "<red><bold>The network is under maintenance.</bold></red>\n\n<gray>Please try again later."
  # Shown to players refused by the network whitelist.
  not-whitelisted: "<red><bold>This network is whitelisted.</bold></red>\n\n<gray>You are not on the list."
  # java.time pattern for <expires>.
  date-pattern: "yyyy-MM-dd HH:mm"
