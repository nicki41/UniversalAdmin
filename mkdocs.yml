# The documentation website: https://universaladmin-mc.github.io/UniversalAdmin/
# Built from docs/ by .github/workflows/docs.yml (mkdocs-material). Links to
# files outside docs/ are pointed at GitHub by scripts/mkdocs_hooks.py.

site_name: UniversalAdmin
site_description: The free, all-in-one admin plugin for Paper - moderation, reports, staff tools, worlds, networks and a full audit log.
site_url: https://universaladmin-mc.github.io/UniversalAdmin/
repo_url: https://github.com/universaladmin-mc/UniversalAdmin
repo_name: universaladmin-mc/UniversalAdmin
edit_uri: edit/main/docs/
copyright: UniversalAdmin is licensed under the GPL-3.0-or-later; the extension API under Apache-2.0.

docs_dir: docs
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Server owners:
      - user/installation.md
      - user/configuration.md
      - user/commands.md
      - user/permissions.md
      - Modules:
